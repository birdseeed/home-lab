<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Home lab network overview</title>
  <desc id="d">UniFi gateway, switch and access points, five VLANs with isolation, and a Proxmox host whose CI runner sits on its own isolated VLAN.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
    .h{font-size:20px;font-weight:600;fill:#1f2328}
    .t{font-size:14px;font-weight:600;fill:#1f2328}
    .s{font-size:12px;fill:#59636e}
    .line{stroke:#8c959f;stroke-width:1.5;fill:none}
    .iso{fill:#dafbe1;stroke:#1a7f37}
    .open{fill:#fff8c5;stroke:#9a6700}
    .isot{font-size:11px;font-weight:600;fill:#1a7f37}
    .opent{font-size:11px;font-weight:600;fill:#9a6700}
    .host{fill:none;stroke:#57606a;stroke-width:1.5;stroke-dasharray:6 4}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}.h,.t{fill:#e6edf3}.s{fill:#9198a1}
      .line{stroke:#6e7681}.iso{fill:#12261e;stroke:#3fb950}.open{fill:#272115;stroke:#d29922}
      .isot{fill:#3fb950}.opent{fill:#d29922}.host{stroke:#8b949e}
    }
  </style>
  <rect class="bg" width="960" height="680"/>
  <text class="h" x="32" y="40">Home lab network</text>

  <!-- physical path -->
  <rect class="box" x="32" y="70" width="150" height="56" rx="8"/><text class="t" x="107" y="95" text-anchor="middle">Internet</text><text class="s" x="107" y="113" text-anchor="middle">ISP</text>
  <rect class="box" x="232" y="70" width="170" height="56" rx="8"/><text class="t" x="317" y="95" text-anchor="middle">UCG Ultra</text><text class="s" x="317" y="113" text-anchor="middle">Gateway and firewall</text>
  <rect class="box" x="452" y="70" width="170" height="56" rx="8"/><text class="t" x="537" y="95" text-anchor="middle">USW Lite 8 PoE</text><text class="s" x="537" y="113" text-anchor="middle">Switch</text>
  <rect class="box" x="672" y="70" width="256" height="56" rx="8"/><text class="t" x="800" y="95" text-anchor="middle">2 × U7 Lite</text><text class="s" x="800" y="113" text-anchor="middle">WiFi 7 access points</text>
  <path class="line" d="M182 98H232M402 98H452M622 98H672"/>

  <rect class="box" x="452" y="146" width="170" height="56" rx="8"/><text class="t" x="537" y="171" text-anchor="middle">Netgear M4100-26G</text><text class="s" x="537" y="189" text-anchor="middle">24 port managed switch</text>
  <path class="line" d="M537 126V146M317 126V230"/>
  <g transform="translate(0,80)">
  <!-- VLANs -->
    <path class="line" d="M317 150V150M116 150H848M116 150V170M299 150V170M482 150V170M665 150V170M848 150V170"/>
  <g>
    <rect class="open" x="32" y="170" width="168" height="78" rx="8"/><text class="t" x="116" y="196" text-anchor="middle">Main · VLAN 1</text><text class="s" x="116" y="215" text-anchor="middle">Trusted devices, servers</text><text class="opent" x="116" y="236" text-anchor="middle">Not isolated</text>
    <rect class="iso" x="215" y="170" width="168" height="78" rx="8"/><text class="t" x="299" y="196" text-anchor="middle">IoT · VLAN 2</text><text class="s" x="299" y="215" text-anchor="middle">Smart home devices</text><text class="isot" x="299" y="236" text-anchor="middle">Isolated</text>
    <rect class="iso" x="398" y="170" width="168" height="78" rx="8"/><text class="t" x="482" y="196" text-anchor="middle">Guest · VLAN 3</text><text class="s" x="482" y="215" text-anchor="middle">Visitors</text><text class="isot" x="482" y="236" text-anchor="middle">Isolated</text>
    <rect class="iso" x="581" y="170" width="168" height="78" rx="8"/><text class="t" x="665" y="196" text-anchor="middle">CI · VLAN 7</text><text class="s" x="665" y="215" text-anchor="middle">GitHub Actions runners</text><text class="isot" x="665" y="236" text-anchor="middle">Isolated</text>
    <rect class="iso" x="764" y="170" width="168" height="78" rx="8"/><text class="t" x="848" y="196" text-anchor="middle">AI Agent · VLAN 50</text><text class="s" x="848" y="215" text-anchor="middle">AI agent workloads</text><text class="isot" x="848" y="236" text-anchor="middle">Isolated</text>
  </g>

  <!-- Proxmox host -->
  <rect class="host" x="32" y="300" width="736" height="200" rx="12"/>
  <text class="t" x="52" y="328">Proxmox VE host · HP ProDesk 600 G1 Mini</text>
  <rect class="box" x="52" y="350" width="220" height="120" rx="8"/><text class="t" x="162" y="378" text-anchor="middle">Storage VM</text><text class="s" x="162" y="400" text-anchor="middle">Four disks passed through</text><text class="s" x="162" y="419" text-anchor="middle">mergerfs pool, about 28 TB</text><text class="s" x="162" y="438" text-anchor="middle">SMB, Docker, dashboards</text><text class="opent" x="162" y="458" text-anchor="middle">Main</text>
  <rect class="box" x="290" y="350" width="220" height="120" rx="8"/><text class="t" x="400" y="378" text-anchor="middle">Home Assistant VM</text><text class="s" x="400" y="400" text-anchor="middle">Home automation</text><text class="opent" x="400" y="458" text-anchor="middle">Main</text>
  <rect class="iso" x="528" y="350" width="220" height="120" rx="8"/><text class="t" x="638" y="378" text-anchor="middle">CI runner VM</text><text class="s" x="638" y="400" text-anchor="middle">Self hosted GitHub Actions</text><text class="s" x="638" y="419" text-anchor="middle">Linux runner</text><text class="isot" x="638" y="458" text-anchor="middle">VLAN 7 · isolated</text>
  <path class="line" d="M665 248V350M116 248V300"/>

  <!-- Macs -->
  <rect class="box" x="790" y="300" width="138" height="200" rx="8"/><text class="t" x="859" y="330" text-anchor="middle">MacBook Pro</text><text class="s" x="859" y="352" text-anchor="middle">M4, 24 GB</text><text class="s" x="859" y="390" text-anchor="middle">Parallels macOS</text><text class="s" x="859" y="408" text-anchor="middle">CI and test VMs</text><text class="s" x="859" y="446" text-anchor="middle">Ollama serving</text><text class="s" x="859" y="464" text-anchor="middle">Qwen locally</text>

  <text class="s" x="32" y="560">Isolated networks cannot reach Main or each other. Only the specific management access each one needs is allowed through the gateway.</text>
  <text class="s" x="32" y="580">Addresses, rules and hostnames are deliberately left out.</text>
  </g>
</svg>
